[project]
name = "nyx"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lavanya", email = "lavanyaropt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-text-splitters>=1.1.2",
    "lxml>=6.1.3",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.0.1",
    "shortuuid>=1.0.13",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
nyx = "nyx:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
